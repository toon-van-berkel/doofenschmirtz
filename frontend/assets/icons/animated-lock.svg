<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 27 30"
  width="108"
  height="120"
  class="lock-icon"
  aria-hidden="true"
>
  <style>
    .lock__shackle {
      transform-box: view-box;
      transform-origin: 7.5px 10.5px;
    }

    .lock-icon.is-open .lock__shackle {
      animation: unlock 450ms cubic-bezier(.22, 1, .36, 1) forwards;
    }

    .lock-icon.is-closed .lock__shackle {
      animation: lock 400ms cubic-bezier(.22, 1, .36, 1) forwards;
    }

    @keyframes unlock {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }
      45% {
        transform: translate(0, -3px) rotate(0deg);
      }
      100% {
        transform: translate(1.5px, -3px) rotate(-20deg);
      }
    }

    @keyframes lock {
      0% {
        transform: translate(1.5px, -3px) rotate(-20deg);
      }
      55% {
        transform: translate(0, -3px) rotate(0deg);
      }
      100% {
        transform: translate(0, 0) rotate(0deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .lock-icon.is-open .lock__shackle,
      .lock-icon.is-closed .lock__shackle {
        animation: none;
      }

      .lock-icon.is-open .lock__shackle { transform: translate(1.5px, -3px) rotate(-20deg); }
      .lock-icon.is-closed .lock__shackle { transform: translate(0, 0) rotate(0deg); }
    }
  </style>

  <!-- Moving metal shackle, based directly on Group 74.svg -->
  <g class="lock__shackle">
    <g transform="translate(4.5 0)">
      <path
        d="M9 2.99997C12.3137 2.99998 15 5.68631 15 9.00001V10.5025C16.1629 10.4743 16.8817 10.522 18 10.7257V9.00001C18 4.02945 13.9705 8.16634e-06 9 0C4.02944 0 0 4.02945 0 9.00001V10.7257C1.10997 10.534 1.84373 10.4793 2.99997 10.5025V9.00001C2.99997 5.6863 5.6863 2.99997 9 2.99997Z"
        fill="currentColor"
      />
    </g>
  </g>

