<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doofenshmirtz</title>
    <link rel="shortcut icon" href="./assets/favicon-bg.svg" type="image/x-icon">

    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/icon.css">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="./css/brand.css">
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>
    <a href="/" class="brand">
        <img class="brand-icon" src="./assets/favicon.svg" alt="">
        <p class="brand__title-container">
            <span class="brand__title-bold">Doofenshmirtz</span>
            <span class="brand__title-description">Clean control. Clear progress.</span>
        </p>
    </a>

    <main>

        <section>
            <h1>Register</h1>

            <form id="register-form">

                <label>
                    Username
                    <input
                        type="text"
                        id="register-username"
                        autocomplete="username"
                        required
                    >
                </label>

                <label>
                    Email
                    <input
                        type="email"
                        id="register-email"
                        autocomplete="email"
                        required
                    >
                </label>

                <label>
                    Password
                    <input
                        type="password"
                        id="register-password"
                        autocomplete="new-password"
                        required
                    >
                </label>

                <button type="submit">
                    Register
                </button>

            </form>

            <p id="register-message"></p>
        </section>


        <section>
            <h1>Login</h1>

            <form id="login-form">

                <label>
                    Email
                    <input
                        type="email"
                        id="login-email"
                        autocomplete="username"
                        required
                    >
                </label>

                <label>
                    Password
                    <input
                        type="password"
                        id="login-password"
                        autocomplete="current-password"
                        required
                    >
                </label>

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="login-message"></p>
        </section>

    </main>

    <nav>
        <a href="/">
            <span class="icon icon-home-bg current"></span>
            Home
        </a>

        <a href="/tasks">
            <span class="icon icon-tasks"></span>
            Tasks
        </a>

        <a href="/rewards">
            <span class="icon icon-present"></span>
            Rewards
        </a>

        <a href="/activity">
            <span class="icon icon-activity"></span>
            Activity
        </a>

        <a href="/profile">
            <span class="icon icon-profile"></span>
            Profile
        </a>
    </nav>

    <script type="module">
        import { authApi } from './js/api/index.js';


        const registerForm = document.querySelector('#register-form');
        const registerMessage = document.querySelector('#register-message');

        registerForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const username =
                document.querySelector('#register-username').value;

            const email =
                document.querySelector('#register-email').value;

            const password =
                document.querySelector('#register-password').value;

            try {
                const result = await authApi.register(
                    username,
                    email,
                    password
                );

                registerMessage.textContent =
                    result.message ?? 'Registration complete';

                registerForm.reset();

            } catch (error) {
                registerMessage.textContent =
                    error.message;
            }
        });


        const loginForm = document.querySelector('#login-form');
        const loginMessage = document.querySelector('#login-message');

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const email =
                document.querySelector('#login-email').value;

            const password =
                document.querySelector('#login-password').value;

            try {
                const result = await authApi.login(
                    email,
                    password
                );

                loginMessage.textContent =
                    `Logged in as ${result.user.username}`;

            } catch (error) {
                loginMessage.textContent =
                    error.message;
            }
        });
    </script>

</body>

</html>
