<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Doofenshmirtz</title>
    <link rel="stylesheet" href="./css/base/common.css">
    <link rel="stylesheet" href="./css/base/colors.css">
    <link rel="stylesheet" href="./css/base/font.css">
    <link rel="stylesheet" href="./css/base/icon.css">
    <link rel="stylesheet" href="./css/base/brand.css">
    <link rel="stylesheet" href="./css/components/nav.css">
</head>
<body class="is-loading">
    <div class="page-loader" role="status" aria-label="Page loading">
        <img class="page-loader__logo" src="./assets/favicon.svg" alt="">
    </div>

    <a href="./index.html" class="brand">
        <img class="brand-icon" src="./assets/favicon.svg" alt="">
        <span class="brand__title-container">
            <span class="brand__title-bold">Doofenshmirtz</span>
            <span class="brand__title-description">Clean control. Clear progress.</span>
        </span>
    </a>

    <main>
        <h1>My Profile</h1>
        <section>
            <h2>Account Details</h2>
            <div>
                <p>Username:</p>
                <p id="username"></p>
            </div>

            <div>
                <p>Email address:</p>
                <p id="masked-email"></p>
            </div>
        </section>

        <section>
            <h2>View full email address</h2>
            <p>Enter your password to view full email address.</p>

            <form id="reveal-email-form">
                <div>
                    <label for="current-password">Current password:</label>
                    <input
                        type="password"
                        id="current-password"
                        name="current-password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    View email address
                </button>
            </form>

            <p id="error-message" role="alert" hidden></p>

            <div id="full-email-container" hidden>
                <p>Full email address:</p>
                <p id="full-email"></p>
            </div>
        </section>

        <button id="logout-button" type="button">Log out</button>
    </main>

    <nav>
        <a href="./index.html">
            <span class="icon icon-home"></span>
            Home
        </a>
        <a href="./tasks.html">
            <span class="icon icon-tasks"></span>
            Tasks
        </a>
        <a href="./store.html">
            <span class="icon icon-present"></span>
            Rewards
        </a>
        <a href="./activity.html">
            <span class="icon icon-activity"></span>
            Activity
        </a>
        <a href="./profile.html">
            <span class="icon icon-profile-bg current"></span>
            Profile
        </a>
    </nav>

    <script type="module" src="./js/components/loader.js"></script>
    <script type="module" src="./js/components/nav.js"></script>
    <script type="module" src="./js/pages/profile.js"></script>
</body>
</html>
